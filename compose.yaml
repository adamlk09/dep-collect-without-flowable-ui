services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: collector
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - dept-collect-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1035:1025"
      - "8035:8025"

volumes:
  dept-collect-postgres-data:
