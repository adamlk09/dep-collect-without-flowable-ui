spring:
  application:
    name: case-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/case_service}
    username: ${DB_USER:collector}
    password: ${DB_PASSWORD:collector}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8091}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  bounded-context: casefile
  capabilities: cases,actions,notes,timeline

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
